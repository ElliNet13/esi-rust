[package]
name = "esi_vm"
version = "1.2.0"
edition = "2021"

[dependencies]
sdl3 = "0.18"
clap = { version = "4", features = ["derive"] }
lzma-rs = "0.3"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
ctrlc = "3.4"
crossterm = "0.27"
rfd = "0.15"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1