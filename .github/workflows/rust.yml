name: Rust

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

env:
  CARGO_TERM_COLOR: always

jobs:
  test-linux:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Cache SDL3 install folder
      - name: Cache SDL3
        id: cache-sdl3
        uses: actions/cache@v4
        with:
          path: /tmp/sdl3-install
          key: sdl3-linux-3.1.0

      # Build SDL3 only if cache miss
      - name: Build SDL3 (Linux)
        if: steps.cache-sdl3.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y git cmake ninja-build build-essential pkg-config

          git clone --depth 1 --branch release-3.1.0 https://github.com/libsdl-org/SDL.git
          cd SDL

          cmake -B build -S . \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/tmp/sdl3-install

          cmake --build build -j
          cmake --install build

      # Expose SDL3 to pkg-config + linker
      - name: Setup SDL3 environment
        run: |
          echo "PKG_CONFIG_PATH=/tmp/sdl3-install/lib/pkgconfig" >> $GITHUB_ENV
          echo "LD_LIBRARY_PATH=/tmp/sdl3-install/lib" >> $GITHUB_ENV

      - name: Build
        run: cargo build --verbose

      - name: Run tests
        run: cargo test --verbose


  release:
    needs: test-linux
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact: linux
            binary: esi-vm
          - os: windows-latest
            artifact: windows
            binary: esi-vm.exe

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      # -------------------------
      # Linux SDL3 (cached build)
      # -------------------------
      - name: Cache SDL3 (Linux)
        if: runner.os == 'Linux'
        id: cache-sdl3
        uses: actions/cache@v4
        with:
          path: /tmp/sdl3-install
          key: sdl3-linux-3.1.0

      - name: Build SDL3 (Linux)
        if: runner.os == 'Linux' && steps.cache-sdl3.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y git cmake ninja-build build-essential pkg-config

          git clone --depth 1 --branch release-3.1.0 https://github.com/libsdl-org/SDL.git
          cd SDL

          cmake -B build -S . \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/tmp/sdl3-install

          cmake --build build -j
          cmake --install build

      - name: Setup SDL3 env (Linux)
        if: runner.os == 'Linux'
        run: |
          echo "PKG_CONFIG_PATH=/tmp/sdl3-install/lib/pkgconfig" >> $GITHUB_ENV
          echo "LD_LIBRARY_PATH=/tmp/sdl3-install/lib" >> $GITHUB_ENV

      # -------------------------
      # Windows SDL3 (vcpkg)
      # -------------------------
      - name: Install SDL3 (Windows)
        if: runner.os == 'Windows'
        uses: microsoft/vcpkg-action@v1
        with:
          pkgs: sdl3
          triplet: x64-windows

      # -------------------------
      # Build release
      # -------------------------
      - name: Build release
        run: cargo build --release --verbose

     
