name: Rust

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

env:
  CARGO_TERM_COLOR: always
  SDL3_VERSION: release-3.4.12

jobs:
  test-linux:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # -----------------------------
      # FULL SDL3 DEPENDENCIES
      # -----------------------------
      - name: Install SDL3 dependencies (FULL)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential git make pkg-config cmake ninja-build \
            gnome-desktop-testing \
            libasound2-dev \
            libpulse-dev \
            libaudio-dev \
            libfribidi-dev \
            libjack-dev \
            libsndio-dev \
            libx11-dev \
            libxext-dev \
            libxrandr-dev \
            libxcursor-dev \
            libxfixes-dev \
            libxi-dev \
            libxss-dev \
            libxtst-dev \
            libxkbcommon-dev \
            libdrm-dev \
            libgbm-dev \
            libgl1-mesa-dev \
            libgles2-mesa-dev \
            libegl1-mesa-dev \
            libdbus-1-dev \
            libibus-1.0-dev \
            libudev-dev \
            libthai-dev \
            libusb-1.0-0-dev \
            libpipewire-0.3-dev \
            libwayland-dev \
            libdecor-0-dev \
            liburing-dev \
            libvulkan-dev \
            vulkan-tools

      # -----------------------------
      # SDL3 CACHE
      # -----------------------------
      - name: Cache SDL3
        id: cache-sdl3
        uses: actions/cache@v4
        with:
          path: /tmp/sdl3-install
          key: sdl3-linux-${{ env.SDL3_VERSION }}

      # -----------------------------
      # BUILD SDL3 ONLY IF NEEDED
      # -----------------------------
      - name: Build SDL3 (Linux)
        if: steps.cache-sdl3.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch $SDL3_VERSION https://github.com/libsdl-org/SDL.git
          cd SDL

          cmake -B build -S . \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/tmp/sdl3-install

          cmake --build build -j
          cmake --install build

      # -----------------------------
      # SDL3 ENV
      # -----------------------------
      - name: Setup SDL3 environment
        run: |
          echo "PKG_CONFIG_PATH=/tmp/sdl3-install/lib/pkgconfig" >> $GITHUB_ENV
          echo "LD_LIBRARY_PATH=/tmp/sdl3-install/lib" >> $GITHUB_ENV

      # -----------------------------
      # RUST BUILD + TEST
      # -----------------------------
      - name: Build
        run: cargo build --verbose

      - name: Run tests
        run: cargo test --verbose


  release:
    needs: test-linux
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact: linux
            binary: esi-vm
          - os: windows-latest
            artifact: windows
            binary: esi-vm.exe

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      # -----------------------------
      # LINUX SDL3 CACHE + BUILD
      # -----------------------------
      - name: Install SDL3 dependencies (Linux full)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential git make pkg-config cmake ninja-build \
            gnome-desktop-testing \
            libasound2-dev \
            libpulse-dev \
            libaudio-dev \
            libfribidi-dev \
            libjack-dev \
            libsndio-dev \
            libx11-dev \
            libxext-dev \
            libxrandr-dev \
            libxcursor-dev \
            libxfixes-dev \
            libxi-dev \
            libxss-dev \
            libxtst-dev \
            libxkbcommon-dev \
            libdrm-dev \
            libgbm-dev \
            libgl1-mesa-dev \
            libgles2-mesa-dev \
            libegl1-mesa-dev \
            libdbus-1-dev \
            libibus-1.0-dev \
            libudev-dev \
            libthai-dev \
            libusb-1.0-0-dev \
            libpipewire-0.3-dev \
            libwayland-dev \
            libdecor-0-dev \
            liburing-dev \
            libvulkan-dev \
            vulkan-tools

      - name: Cache SDL3 (Linux)
        if: runner.os == 'Linux'
        id: cache-sdl3
        uses: actions/cache@v4
        with:
          path: /tmp/sdl3-install
          key: sdl3-linux-${{ env.SDL3_VERSION }}

      - name: Build SDL3 (Linux cache miss)
        if: runner.os == 'Linux' && steps.cache-sdl3.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch $SDL3_VERSION https://github.com/libsdl-org/SDL.git
          cd SDL

          cmake -B build -S . \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/tmp/sdl3-install

          cmake --build build -j
          cmake --install build

      - name: Setup SDL3 env (Linux)
        if: runner.os == 'Linux'
        run: |
          echo "PKG_CONFIG_PATH=/tmp/sdl3-install/lib/pkgconfig" >> $GITHUB_ENV
          echo "LD_LIBRARY_PATH=/tmp/sdl3-install/lib" >> $GITHUB_ENV

      # -----------------------------
      # WINDOWS SDL3 (vcpkg)
      # -----------------------------
      - name: Install SDL3 (Windows)
        if: runner.os == 'Windows'
        uses: microsoft/vcpkg-action@v1
        with:
          pkgs: sdl3
          triplet: x64-windows

      # -----------------------------
      # BUILD RELEASE
      # -----------------------------
      - name: Build release
        run: cargo build --release --verbose

      # -----------------------------
      # ARTIFACT
      # -----------------------------
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: target/release/${{ matrix.binary }}
