name: Rust

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

env:
  CARGO_TERM_COLOR: always
  SDL3_VERSION: release-3.4.12

jobs:
  test-linux:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # -----------------------------
      # SDL3 CACHE (LINUX)
      # -----------------------------
      - name: Cache SDL3
        id: cache-sdl3
        uses: actions/cache@v4
        with:
          path: /tmp/sdl3-install
          key: sdl3-linux-${{ env.SDL3_VERSION }}

      # -----------------------------
      # SDL3 DEPS ONLY IF NEEDED
      # -----------------------------
      - name: Install SDL3 build deps (only if cache miss)
        if: steps.cache-sdl3.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential git make pkg-config cmake ninja-build \
            libasound2-dev libpulse-dev \
            libx11-dev libxext-dev libxrandr-dev \
            libxkbcommon-dev libgl1-mesa-dev libvulkan-dev \
            libwayland-dev libdrm-dev libgbm-dev

      # -----------------------------
      # BUILD SDL3 ONLY IF NEEDED
      # -----------------------------
      - name: Build SDL3 (cache miss only)
        if: steps.cache-sdl3.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch $SDL3_VERSION https://github.com/libsdl-org/SDL.git
          cd SDL

          cmake -B build -S . \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/tmp/sdl3-install

          cmake --build build -j
          cmake --install build

      # -----------------------------
      # SDL3 ENV
      # -----------------------------
      - name: Setup SDL3 env
        run: |
          echo "PKG_CONFIG_PATH=/tmp/sdl3-install/lib/pkgconfig" >> $GITHUB_ENV
          echo "LD_LIBRARY_PATH=/tmp/sdl3-install/lib" >> $GITHUB_ENV

      # -----------------------------
      # RUST BUILD
      # -----------------------------
      - name: Build
        run: cargo build --verbose

      - name: Run tests
        run: cargo test --verbose


  release:
    needs: test-linux
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact: linux
            binary: esi-vm
          #- os: windows-latest
          #  artifact: windows
          #  binary: esi-vm.exe
          # Windows removed for now until I can get it to work

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      # -----------------------------
      # LINUX SDL3 CACHE
      # -----------------------------
      - name: Cache SDL3 (Linux)
        if: runner.os == 'Linux'
        id: cache-sdl3
        uses: actions/cache@v4
        with:
          path: /tmp/sdl3-install
          key: sdl3-linux-${{ env.SDL3_VERSION }}

      # -----------------------------
      # WINDOWS VCPKG SETUP
      # -----------------------------
      - name: Setup vcpkg
        if: runner.os == 'Windows'
        uses: friendlyanon/setup-vcpkg@v1
        with:
          committish: 2024.11.16

      # -----------------------------
      # CACHE VCPKG INSTALLED PACKAGES
      # -----------------------------
      - name: Cache vcpkg installed packages
        if: runner.os == 'Windows'
        uses: actions/cache@v4
        with:
          path: |
            vcpkg_installed
            ${{ env.VCPKG_ROOT }}/installed
          key: vcpkg-${{ runner.os }}-sdl3

      # -----------------------------
      # INSTALL SDL3 VIA VCPKG (ONLY IF CACHE MISS)
      # -----------------------------
      - name: Install SDL3 (Windows)
        if: runner.os == 'Windows'
        run: |
          vcpkg install sdl3 --triplet x64-windows

      # -----------------------------
      # BUILD SDL3 LINUX (ONLY IF NEEDED)
      # -----------------------------
      - name: Install SDL3 deps (Linux cache miss only)
        if: runner.os == 'Linux' && steps.cache-sdl3.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential git make pkg-config cmake ninja-build \
            libasound2-dev libpulse-dev \
            libx11-dev libxext-dev libxrandr-dev \
            libxkbcommon-dev libgl1-mesa-dev libvulkan-dev \
            libwayland-dev libdrm-dev libgbm-dev

      - name: Build SDL3 (Linux cache miss only)
        if: runner.os == 'Linux' && steps.cache-sdl3.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch $SDL3_VERSION https://github.com/libsdl-org/SDL.git
          cd SDL

          cmake -B build -S . \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/tmp/sdl3-install

          cmake --build build -j
          cmake --install build

      - name: Setup SDL3 env (Linux)
        if: runner.os == 'Linux'
        run: |
          echo "PKG_CONFIG_PATH=/tmp/sdl3-install/lib/pkgconfig" >> $GITHUB_ENV
          echo "LD_LIBRARY_PATH=/tmp/sdl3-install/lib" >> $GITHUB_ENV

      # -----------------------------
      # RUST BUILD
      # -----------------------------
      - name: Build release
        run: cargo build --release --verbose

      # -----------------------------
      # ARTIFACT
      # -----------------------------
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: target/release/${{ matrix.binary }}
